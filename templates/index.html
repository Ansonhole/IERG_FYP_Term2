<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUHK 工程系推薦系統</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f4f4f5; margin:0; padding:20px; }
        .container { max-width: 900px; margin:auto; background:white; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.1); overflow:hidden; }
        .header { background:#0066cc; color:white; padding:20px; text-align:center; }
        .messages-area { height:65vh; overflow-y:auto; padding:20px; background:#e5ddd5; }
        .message { margin:12px 0; padding:14px 18px; border-radius:18px; max-width:85%; }
        .received { background:white; align-self:flex-start; }
        .sent { background:#dcf8c6; align-self:flex-end; }
        .input-area { padding:15px; background:#f8f9fa; border-top:1px solid #ddd; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>CUHK 工程系推薦系統</h2>
        </div>

        <div style="padding:12px; background:#f0f0f0;">
            <select id="mode" onchange="switchMode()" style="width:100%; padding:10px; font-size:16px;">
                <option value="0">1. 請選擇模式</option>
                <option value="1">1. 工作推薦模式</option>
                <option value="2">2. 學院推薦模式</option>
            </select>
        </div>

        <div class="messages-area" id="chat"></div>

        <div class="input-area">
            <input type="text" id="query" placeholder="請在此輸入答案或問題..." style="width:100%; padding:12px; border-radius:8px;">
            <button id="sendBtn" style="margin-top:8px; width:100%; padding:12px; background:#0066cc; color:white; border:none; border-radius:8px;">送出</button>
        </div>
    </div>

    <script>
        let currentMode = 0;
        let userProfile = null;        // 已填好的資料
        let currentQuestions = [];
        let answers = [];

        const chat = document.getElementById("chat");
        const queryInput = document.getElementById("query");
        const sendBtn = document.getElementById("sendBtn");

        function addMessage(type, text) {
            const div = document.createElement("div");
            div.className = `message ${type}`;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function switchMode() {
            currentMode = parseInt(document.getElementById("mode").value);
            chat.innerHTML = "";
            userProfile = null;
            answers = [];

            if (currentMode === 1) {
                currentQuestions = [
                    "請輸入你的年級（例如 2、3、4）：",
                    "請輸入主要技能（用逗號分隔，例如 python, machine learning）：",
                    "請輸入興趣領域（用逗號分隔，例如 AI, software engineering）：",
                    "請輸入你的 GPA（例如 3.5）："
                ];
                addMessage("received", "【工作推薦模式】\n\n請依序回答以下問題：");
                addMessage("received", currentQuestions[0]);
            } else if (currentMode === 2){
                currentQuestions = [
                    "1. 你希望住學院宿舍嗎？ (是 / 否 / 無所謂)",
                    "2. 你對基督教氛圍和價值觀的重視程度？ (高 / 中 / 低 / 無所謂)",
                    "3. 你對通識教育（GE課程）的興趣程度？ (高 / 中 / 低)",
                    "4. 你喜歡參加學院活動、領導培訓、交流嗎？ (是 / 否 / 無所謂)",
                    "5. 你比較重視學院的學術氛圍還是生活體驗？ (學術 / 生活 / 兩者都要)",
                    "6. 你的性格比較內向還是外向？ (內向 / 外向 / 都可以)"
                ];
                addMessage("received", "【學院推薦模式】\n\n請依序回答以下問題，我會為你推薦最適合的學院：");
                addMessage("received", currentQuestions[0]);
            } else {
                addMessage("received", "你未選擇任何模式，請先在上方選擇模式。");
            }
        }

        async function sendMessage() {
            const text = queryInput.value.trim();
            if (!text) return;

            addMessage("sent", text);
            queryInput.value = "";

            // 還在收集資料階段
            if (!userProfile && answers.length < currentQuestions.length) {
                answers.push(text);

                if (answers.length < currentQuestions.length) {
                    addMessage("received", currentQuestions[answers.length]);
                } else {
                    // 全部填完，儲存資料並通知後端
                    userProfile = answers;
                    addMessage("received", "✅ 資料已收集完成！現在你可以開始提問了。\n例如：推薦適合我的實習 / 推薦最適合我的學院");
                }
            } 
            // 已收集完資料，正常推薦
            else {
                try {
                    const res = await fetch("/recommend", {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        body: JSON.stringify({ 
                            query: text, 
                            mode: currentMode,
                            profile_data: userProfile
                        })
                    });

                    const data = await res.json();
                    addMessage("received", data.success ? data.answer : "錯誤：" + data.error);
                } catch (err) {
                    addMessage("received", "網路錯誤，請稍後再試。");
                }
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        queryInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });

        window.onload = () => {
            addMessage("received", "歡迎使用 CUHK 工程系推薦系統！\n請先在上方選擇模式。");
        };
    </script>
</body>
</html>
