<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUHK Engineering Recommendation System</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f4f4f5; margin:0; padding:20px; }
        .container { max-width: 900px; margin:auto; background:white; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.1); overflow:hidden; }
        .header { background:#0066cc; color:white; padding:20px; text-align:center; }
        .messages-area { height:60vh; overflow-y:auto; padding:20px; background:#e5ddd5; display:flex; flex-direction:column; gap:12px; }
        .message { max-width: 85%; padding:14px 18px; border-radius:18px; position: relative; padding-bottom: 26px;}
        .received { background:white; align-self:flex-start; }
        .sent { background:#dcf8c6; align-self:flex-end; }
        .input-area { padding:15px; background:#f8f9fa; border-top:1px solid #ddd; }
        .evaluation-box { background:#fff3cd; padding:15px; margin:15px 0; border-radius:10px; border:1px solid #ffeaa7; }
        .message-time { position: absolute; bottom: 6px; right: 12px; font-size: 10.5px; color: #888; font-weight: 400; }
        .received .message-time { left: 12px; right: auto; }

    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>CUHK Engineering Recommendation System</h2>
        </div>

        <div style="padding:12px; background:#f0f0f0;">
            <select id="mode" onchange="switchMode()" style="width:100%; padding:10px; font-size:16px;">
                <option value="0">Please Select Model</option>
                <option value="1">1. Job Recommendation System</option>
                <option value="2">2. College Recommendation System</option>
            </select>
        </div>

        <div class="messages-area" id="chat"></div>

        <div class="input-area">
            <input type="text" id="query" placeholder="Input..." style="width:100%; padding:12px; border-radius:8px;">
            <button id="sendBtn" style="margin-top:8px; width:100%; padding:12px; background:#0066cc; color:white; border:none; border-radius:8px;">Summit</button>
        </div>
    </div>

    <script>
        let currentMode = 0;
        let userProfile = null;        // 已填好的資料
        let currentQuestions = [];
        let answers = [];
        let lastRecommendedIds = [];

        const chat = document.getElementById("chat");
        const queryInput = document.getElementById("query");
        const sendBtn = document.getElementById("sendBtn");

        function getCurrentTime() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; // 12小時制
            return `${hours}:${minutes.toString().padStart(2, '0')} ${ampm}`;
        }

        function addMessage(type, text) {
            const div = document.createElement("div");
            div.className = `message ${type}`;
            div.textContent = text;
            if (type === "received" && (text.includes("【") || text.includes("Score:"))) {
                const items = text.split(/【\d+】/);  // 按 【1】、【2】 分割
                items.forEach((item, index) => {
                    if (item.trim() === "") return;
                    if (index === 0 && !item.includes("Score:")) {
                        const p = document.createElement("div");
                        p.className = "message received";
                        p.textContent = item.trim();
                        div.innerHTML = `
                            ${text.replace(/\n/g, '<br>')}
                            <span class="message-time">${getCurrentTime()}</span>
                        `;
                        chat.appendChild(p);
                    } else if (item.trim()) {
                        const p = document.createElement("div");
                        p.className = "message received";
                        p.textContent = "【" + (index) + "】" + item.trim();
                        div.innerHTML = `
                            ${text.replace(/\n/g, '<br>')}
                            <span class="message-time">${getCurrentTime()}</span>
                        `;
                        chat.appendChild(p);
                    }
                });
            } else {
                div.textContent = text;
                div.innerHTML = `
                    ${text.replace(/\n/g, '<br>')}
                    <span class="message-time">${getCurrentTime()}</span>
                `;
                chat.appendChild(div);
            }
            chat.scrollTop = chat.scrollHeight;
        }

        function showEvaluation(recommendedIds) {
            lastRecommendedIds = recommendedIds || [];
            if (lastRecommendedIds.length === 0) return;

            const evalDiv = document.createElement("div");
            evalDiv.className = "evaluation-box";
            evalDiv.innerHTML = `
                <strong>📊 Please evaluate the results of this recommendation.</strong><br>
                <small>Select the recommended items that you find "suitable/useful" (multiple selections are allowed).</small><br><br>
                ${lastRecommendedIds.map((id, idx) => `
                    <label class="recommend-item">
                        <input type="checkbox" value="${id}" class="eval-check"> 
                        【${idx+1}】 Suggestion ${idx+1}
                    </label><br>
                `).join('')}
                <br>
                <button onclick="submitEvaluation()" style="padding:8px 16px; background:#0066cc; color:white; border:none; border-radius:6px;">Submit evaluation</button>
            `;
            chat.appendChild(evalDiv);
            chat.scrollTop = chat.scrollHeight;
        }

        async function submitEvaluation() {
            const checked = Array.from(document.querySelectorAll('.eval-check:checked')).map(cb => cb.value);
            
            if (checked.length === 0) {
                alert("Please select at least one recommendation");
                return;
            }

            try {
                const res = await fetch("/evaluate", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        query: "User evaluation of this recommendation",
                        recommended_ids: lastRecommendedIds,
                        ground_truth_ids: checked
                    })
                });

                const data = await res.json();
                addMessage("received", "✅ " + (data.message || "Thank you for your evaluation!"));
            } catch (err) {
                addMessage("received", "❌ The evaluation submission failed. Please try again later.");
            }
        }

        function switchMode() {
            currentMode = parseInt(document.getElementById("mode").value);
            chat.innerHTML = "";
            userProfile = null;
            answers = [];

            if (currentMode === 1) {
                currentQuestions = [
                    "Please enter your year.（for example: 2、3、4）：",
                    "Please enter your main skills.（Separate with commas, for example: python, machine learning）：",
                    "Please enter your interest.（Separate with commas, for example: AI, software engineering）：",
                    "Please enter your GPA（for example: 3.5）："
                ];
                addMessage("received", "【Job Recommendation Mode】\n\nPlease answer the following questions in order:");
                addMessage("received", currentQuestions[0]);
            } else if (currentMode === 2){
                currentQuestions = [
                    "1. Do you want to live in college dormitories? (Yes / No / Doesn't matter)",
                    "2. How much do you value the Christian atmosphere and values? (High / Medium / Low / Doesn't matter)",
                    "3. How interested are you in general education (GE) courses? (High / Medium / Low)",
                    "4. Do you enjoy participating in college activities, leadership training, and networking? (Yes / No / Doesn't matter)",
                    "5. Do you value the academic atmosphere or the student life experience more at the college? (Academic / Life / Both)",
                    "6. Are you more introverted or extroverted? (Introverted / Extroverted / Either)"
                ];
                addMessage("received", "【College Recommendation Mode】\n\nPlease answer the following questions in order:");
                addMessage("received", currentQuestions[0]);
            } else {
                addMessage("received", "You have not selected any mode. Please select a mode above first.");
            }
        }

        async function sendMessage() {
            const text = queryInput.value.trim();
            if (!text) return;

            addMessage("sent", text);
            queryInput.value = "";

            // 還在收集資料階段
            if (!userProfile && answers.length < currentQuestions.length) {
                answers.push(text);

                if (answers.length < currentQuestions.length) {
                    addMessage("received", currentQuestions[answers.length]);
                } else {
                    // 全部填完，儲存資料並通知後端
                    userProfile = answers;
                    if (currentMode == 1) {
                        addMessage("received", "✅ The information has been collected! Now you can start asking questions.\nFor example: Recommend an internship that suits me.");
                    } else {
                        addMessage("received", "✅ The information has been collected! Now you can start asking questions.\nFor example: Recommend a college that suits me.");
                    }
                }
            } 
            // 已收集完資料，正常推薦
            else {
                try {
                    const res = await fetch("/recommend", {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        body: JSON.stringify({ 
                            query: text, 
                            mode: currentMode,
                            profile_data: userProfile
                        })
                    });

                    const data = await res.json();
                    if (data.success) {
                        addMessage("received", data.answer);
                        
                        // 如果有推薦結果，顯示評估功能
                        if (data.is_recommendation_intent && data.recommended_ids.length > 0) {
                            setTimeout(() => {
                                showEvaluation(data.recommended_ids);
                            }, 800);
                        }
                    } else {
                        addMessage("received", "Error：" + (data.error || "Unable to receive a response"));
                    }
                } catch (err) {
                    addMessage("received", "Network error, please try again later.");
                }
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        queryInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });

        window.onload = () => {
            addMessage("received", "Welcome to the CUHK Engineering Recommendation System\nPlease select the mode above first.");
        };
    </script>
</body>
</html>
